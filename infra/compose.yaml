# Локальное окружение: API + PostgreSQL.
# Запуск из корня репозитория: make up  (или docker compose -f infra/compose.yaml up)
name: order-calculator

services:
  api:
    build:
      context: ..
      dockerfile: app/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # внутри сети compose база доступна по имени сервиса db, а не localhost
      DATABASE_URL: postgresql://${POSTGRES_USER:-orders}:${POSTGRES_PASSWORD:-orders}@db:5432/${POSTGRES_DB:-orders}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orders}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
