# Настройки инструментов для всего монорепозитория.
# Пакеты описаны отдельно: packages/core/pyproject.toml и app/api/pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/core/src", "app/api/src"]

[tool.coverage.run]
source = ["order_core", "order_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["order_core", "order_api"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["packages/core/src", "app/api/src"]
explicit_package_bases = true
strict_optional = true
warn_unused_ignores = true
